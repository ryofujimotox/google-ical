[project]
name = "google-ical"
version = "0.1.0"
description = "JSON とゴミ収集日 PDF から Google カレンダーを更新するバッチ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.130.0",
  "google-auth>=2.29.0",
  "python-dotenv>=1.0.1",
  "pypdf>=4.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
